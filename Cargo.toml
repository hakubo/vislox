[package]
name = "vislox"
version = "0.1.0"
edition = "2024"
rust-version = "1.91"
description = "Loxone Config-style viewer and change review for Miniserver configs managed by lox, with live values and history"
repository = "https://github.com/hakubo/vislox"
readme = "README.md"
license = "MIT"

[dependencies]
loxone-config = { git = "https://github.com/discostu105/lox" }
loxone-client = { git = "https://github.com/discostu105/lox" }
serde_yaml = "0.9"
# The status check's jdev/cfg/apiKey request. The same TLS features as loxone-client
# (manual roots), so that adding it does not change loxone-client's TLS behaviour.
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-manual-roots"] }
# Checks the Miniserver's CloudDNS certificate (Let's Encrypt) against the
# public web roots, which loxone-client's reqwest (manual roots) has none of.
# The same rustls as reqwest and tokio-tungstenite, on lox's ring provider.
rustls = { version = "0.23", default-features = false, features = ["logging", "ring", "std", "tls12"] }
webpki-roots = "1"
base64 = "0.22"
anyhow = "1"
axum = "0.8"
tower-http = { version = "0.6", features = ["compression-gzip"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "process", "signal", "io-std", "io-util", "fs"] }
tokio-stream = { version = "0.1", features = ["sync"] }
futures-util = "0.3"
# The message types of the WebSocket that loxone-client opens (same version).
tokio-tungstenite = { version = "0.24", default-features = false }
notify = "8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive", "env"] }
sha1 = "0.10"
hex = "0.4"
# Checks a gzipped icon from the Miniserver is whole before it is cached.
flate2 = "1"
chrono = { version = "0.4", features = ["clock", "serde"] }
# The Miniserver's time zone (its config's `Timezone`, e.g. `Europe/Warsaw`): backup times are in it.
chrono-tz = "0.10"
open = "5"
socket2 = { version = "0.6", features = ["all"] }

[profile.release]
lto = "thin"

[dev-dependencies]
tempfile = "3"
zip = { version = "2", default-features = false, features = ["deflate"] }
