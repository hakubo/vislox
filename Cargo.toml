[package]
name = "vislox"
version = "0.1.0"
edition = "2024"
rust-version = "1.91"
description = "Read-only visual viewer for Loxone configs managed by lox / loxone-config, with live reload, history and change review"
license = "Apache-2.0"

[dependencies]
loxone-config = { git = "https://github.com/discostu105/lox" }
loxone-client = { git = "https://github.com/discostu105/lox" }
serde_yaml = "0.9"
anyhow = "1"
axum = "0.8"
tower-http = { version = "0.6", features = ["compression-gzip"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "process", "signal", "io-std", "io-util", "fs"] }
tokio-stream = { version = "0.1", features = ["sync"] }
futures-util = "0.3"
# The message types of the WebSocket that loxone-client opens (same version).
tokio-tungstenite = { version = "0.24", default-features = false }
notify = "8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
sha1 = "0.10"
hex = "0.4"
chrono = { version = "0.4", features = ["clock"] }
open = "5"

[profile.release]
lto = "thin"

[dev-dependencies]
tempfile = "3"
